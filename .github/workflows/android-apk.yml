# بهینه — Behine Android APK build (signed release)
#
# HOW TO ENABLE (one time, from the GitHub web UI — bots may not push
# workflow files):
#   1. Open the branch  arena/019fb441-ba-man-bebin  (top-left switcher).
#   2. Add file → Create new file → name it exactly:
#         .github/workflows/android-apk.yml
#   3. Paste this file's whole content and commit DIRECTLY to that branch.
#
# IMPORTANT: this yaml is intentionally THIN and should never need another
# edit — ALL build logic lives in android-app/ci/build.sh (a normal repo
# file that can be updated by any push). If the build logic changes later,
# only build.sh changes; you never have to paste this file again.
#
# What happens on every push to arena/** that touches android-app/**:
#   - a signed (v1+v2+v3) RELEASE APK is built with the stable CI keystore,
#   - the signature is verified (apksigner + pinned fingerprint),
#   - app-release.apk is uploaded as the  behine-release-apk  artifact.
#   - on failure, the gradle log tail is committed to
#     android-app/ci/last-build-errors.log.txt for diagnosis.

name: build-behine-apk

on:
  push:
    branches: ['arena/**']
    paths: ['android-app/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write # needed to persist the CI keystore / signer pin / failure logs

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      # Pin the Gradle version — never rely on a (possibly absent/too old)
      # runner-provided gradle. AGP 8.5.2 needs Gradle 8.7 or newer.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build + verify APK (all logic in android-app/ci/build.sh)
        env:
          CI_VERSION_CODE: ${{ github.run_number }}
        run: bash android-app/ci/build.sh
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: behine-release-apk
          path: android-app/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
